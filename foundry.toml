[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    '@openzeppelin=lib/openzeppelin-contracts',
    '@uniswap/v3-core=lib/v3-core',
    '@uniswap/v3-periphery=lib/v3-periphery',
    '@uniswap/swap-router-contracts=lib/swap-router-contracts',
]

solc_version = "0.8.19"
evm_version = "london"

[fuzz]
runs = 1000

[invariant]
runs = 64
depth = 512
# depth = 10            # For forge coverage
fail_on_revert = true

[profile.ci]
# Named so CI's FOUNDRY_PROFILE=ci is valid. Inherits default compiler settings.
via_ir = false

[profile.ci.fuzz]
runs = 256

[profile.deploy]
via_ir = true            # Use the Yul IR pipeline for smaller bytecode
optimizer_runs = 200

# This just for quicker testing
# optimizer = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
