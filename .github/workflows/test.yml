name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

jobs:
  test:
    name: ${{ matrix.target }} (${{ matrix.stablecoin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: moc-sovryn
            stablecoin: DOC
          - target: dex-sovryn
            stablecoin: USDRIF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run ${{ matrix.target }}
        env:
          STABLECOIN_TYPE: ${{ matrix.stablecoin }}
        run: make patch-deps && make ${{ matrix.target }}
