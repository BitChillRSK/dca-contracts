name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

jobs:
  test:
    name: ${{ matrix.target }} (${{ matrix.stablecoin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: moc-none
            stablecoin: DOC
          - target: moc-layerbank
            stablecoin: DOC
          - target: moc-sovryn
            stablecoin: DOC
          - target: dex-sovryn
            stablecoin: USDRIF
          - target: invariants-sovryn
            stablecoin: DOC
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable`. `stable` is a moving tag: it rolled 1.7.1 -> 1.8.0 on
          # 2026-08-26 and turned every lane red mid-stack, with no repo change behind it.
          # Under 1.8.0 a `vm.prank(OWNER); new OperationsAdmin();` no longer consumes the
          # prank, so the next `vm.prank` reverts and 10 `setUp()`s fail. That is a real
          # migration this repo still owes, but it must be its own PR, not an ambush on
          # whichever PR happens to run after a Foundry release.
          # Raise this deliberately; do not put `stable` back.
          version: v1.7.1

      - name: Run ${{ matrix.target }}
        env:
          STABLECOIN_TYPE: ${{ matrix.stablecoin }}
        run: make patch-deps && make ${{ matrix.target }}
