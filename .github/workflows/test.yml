name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 1

jobs:
  test:
    name: ${{ matrix.target }} (${{ matrix.stablecoin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: moc-sovryn
            stablecoin: DOC
          - target: dex-sovryn
            stablecoin: USDRIF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        # Both pins are deliberate. `foundry-rs/foundry-toolchain@v1` is a moving tag, and
        # so was `version: stable`, so CI resolved two moving refs at job time.
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # Observed 2026-08-27: `stable` rolled forge 1.7.1 -> 1.8.0 (released 2026-08-26)
          # between two CI runs 45 minutes apart, with no repo change in between. Under 1.8.0
          # these 10 suites fail at `setUp()` with
          # "vm.prank: cannot overwrite a prank until it is applied at least once":
          #   DcaManagerEdgeCasesTest, RoleSecurityTest, DepositSwapPopReentrancyTest,
          #   FeeOnTransferDepositTest, and the 6 HandlerTestHarness subclasses
          #   (Idle/LayerBank/Sovryn/SovrynDex/Tropykus/TropykusDex Erc20HandlerTest).
          # Reproduced on an unmodified pre-upgrade commit, so it is the toolchain, not a PR.
          # The trigger is NOT simply "prank before `new` stops being consumed": InvariantTest
          # runs the same two statements and passes on 1.8.0. Diagnosing it is the migration's
          # job. Until then, pin. Raise this deliberately; do not put `stable` back.
          version: v1.7.1

      - name: Run ${{ matrix.target }}
        env:
          STABLECOIN_TYPE: ${{ matrix.stablecoin }}
        run: make patch-deps && make ${{ matrix.target }}
